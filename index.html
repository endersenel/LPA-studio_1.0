<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPPLab - LPA Studio (Web Edition)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #0a0a0a; color: #fff; display: flex; height: 100vh; overflow: hidden; }
        
        aside { width: 280px; background: #151515; border-right: 1px solid #333; display: flex; flex-direction: column; padding: 20px; }
        aside h2 { color: #00e5ff; font-size: 1.1rem; margin-bottom: 25px; text-align: center; }
        .menu-item { padding: 12px 15px; color: #b8c7ce; text-decoration: none; border-radius: 6px; margin-bottom: 8px; font-size: 0.9rem; cursor: pointer; background: #1a1a1a; transition: 0.2s; }
        .menu-item:hover, .menu-item.active { background: #00e5ff; color: #000; font-weight: bold; }

        main { flex: 1; display: flex; flex-direction: column; overflow-y: auto; padding: 25px; background: #0e0e0e; }
        h3 { color: #00e5ff; margin-bottom: 15px; font-size: 1.3rem; }
        .card { background: #151515; border: 1px solid #333; border-radius: 8px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        
        input[type="file"], select, input[type="number"] { background: #222; color: #fff; border: 1px solid #00e5ff; padding: 8px; border-radius: 5px; width: 100%; margin-top: 8px; margin-bottom: 15px; outline: none; }
        button { background: #00c853; color: #fff; border: none; padding: 10px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; width: 100%; }
        button:hover { background: #00e676; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.85rem; }
        th, td { border: 1px solid #333; padding: 8px; text-align: left; }
        th { background: #1a1a1a; color: #00e5ff; }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .chart-container { position: relative; width: 100%; max-height: 400px; display: flex; justify-content: center; }
    </style>
</head>
<body>

    <aside>
        <h2>SPPLab - LPA Studio</h2>
        <div class="menu-item active" onclick="switchTab('import', this)">1. Veri Yükleme (CSV)</div>
        <div class="menu-item" onclick="switchTab('analysis', this)">2. Temel Profilleme & Grafik</div>
        <div class="menu-item" onclick="switchTab('stats', this)">3. Özet İstatistikler</div>
    </aside>

    <main>
        <!-- TAB 1 -->
        <div id="tab-import" class="tab-content active">
            <h3>Veri Seti Yükleme</h3>
            <div class="card">
                <label>CSV Dosyası Seçin:</label>
                <input type="file" id="csvFile" accept=".csv">
                <p style="font-size: 0.8rem; color: #888; margin-top: 5px;">Sayısal değişkenler içeren bir CSV dosyası yükleyin.</p>
            </div>
            <div class="card">
                <h3>Veri Önizlemesi</h3>
                <div style="overflow-x: auto;"><table id="previewTable"></table></div>
            </div>
        </div>

        <!-- TAB 2 -->
        <div id="tab-analysis" class="tab-content">
            <h3>Gizli Profil Görselleştirme (Means Plot)</h3>
            <div class="card">
                <label>Analiz Değişkenini Seçin:</label>
                <select id="varSelect"></select>
                <button onclick="runAnalysis()">Grafiği Çiz / Analiz Et</button>
            </div>
            <div class="card">
                <div class="chart-container">
                    <canvas id="lpaChart"></canvas>
                </div>
            </div>
        </div>

        <!-- TAB 3 -->
        <div id="tab-stats" class="tab-content">
            <h3>Tanımlayıcı İstatistikler</h3>
            <div class="card">
                <div style="overflow-x: auto;"><table id="statsTable"></table></div>
            </div>
        </div>
    </main>

    <script>
        let rawData = [];
        let headers = [];
        let chartInstance = null;

        function switchTab(tabId, el) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
            el.classList.add('active');
        }

        document.getElementById('csvFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            Papa.parse(file, {
                header: true,
                dynamicTyping: true,
                skipEmptyLines: true,
                complete: function(results) {
                    rawData = results.data;
                    headers = results.meta.fields;
                    populateTablePreview();
                    populateVariables();
                    populateStats();
                    alert("Veri başarıyla yüklendi!");
                }
            });
        });

        function populateTablePreview() {
            const table = document.getElementById('previewTable');
            table.innerHTML = '';
            let headerRow = '<tr>' + headers.map(h => `<th>${h}</th>`).join('') + '</tr>';
            table.innerHTML += headerRow;

            rawData.slice(0, 5).forEach(row => {
                let tr = '<tr>' + headers.map(h => `<td>${row[h]}</td>`).join('') + '</tr>';
                table.innerHTML += tr;
            });
        }

        function populateVariables() {
            const select = document.getElementById('varSelect');
            select.innerHTML = '';
            headers.forEach(h => {
                if (typeof rawData[0][h] === 'number') {
                    let opt = document.createElement('option');
                    opt.value = h;
                    opt.textContent = h;
                    select.appendChild(opt);
                }
            });
        }

        function runAnalysis() {
            const selectedVar = document.getElementById('varSelect').value;
            if (!selectedVar) return;

            const values = rawData.map(r => r[selectedVar]).filter(v => !isNaN(v));
            
            // Basit ortalama bazlı dağılım simülasyonu (Profil Dağılımı)
            const mean = values.reduce((a, b) => a + b, 0) / values.length;
            const low = values.filter(v => v < mean);
            const high = values.filter(v => v >= mean);

            const ctx = document.getElementById('lpaChart').getContext('2d');
            if (chartInstance) chartInstance.destroy();

            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Düşük Profil (Grup 1)', 'Yüksek Profil (Grup 2)'],
                    datasets: [{
                        label: `${selectedVar} Ortalamaları`,
                        data: [
                            low.length ? low.reduce((a,b)=>a+b,0)/low.length : 0, 
                            high.length ? high.reduce((a,b)=>a+b,0)/high.length : 0
                        ],
                        backgroundColor: ['#ff1744', '#00e5ff']
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }

        function populateStats() {
            const table = document.getElementById('statsTable');
            table.innerHTML = '<tr><th>Değişken</th><th>N</th><th>Ortalama</th><th>Std. Sapma</th></tr>';

            headers.forEach(h => {
                if (typeof rawData[0][h] === 'number') {
                    const vals = rawData.map(r => r[h]).filter(v => !isNaN(v));
                    const n = vals.length;
                    const mean = n ? (vals.reduce((a,b)=>a+b,0) / n).toFixed(2) : 0;
                    const sd = n > 1 ? Math.sqrt(vals.reduce((a,b)=>a + Math.pow(b-mean,2),0)/(n-1)).toFixed(2) : 0;
                    
                    table.innerHTML += `<tr><td>${h}</td><td>${n}</td><td>${mean}</td><td>${sd}</td></tr>`;
                }
            });
        }
    </script>
</body>
</html>
